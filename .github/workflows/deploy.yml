name: Deploy WhaleAbyss

on:
  push:
    branches: [ main ]

jobs:
  # Gate: runs on GitHub's runners before anything touches the prod VM.
  # Typecheck is the hard gate (no DB or secrets needed). A full `next build`
  # is intentionally NOT run here — it does build-time DB queries that a CI
  # runner can't reach; the build still runs on the VM in the deploy job.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (blocks deploy on failure)
        run: npx tsc --noEmit

      - name: Lint (informational, non-blocking)
        run: npm run lint
        continue-on-error: true

  deploy:
    # Only deploy if the gate passed.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Yandex Cloud VM
        uses: appleboy/ssh-action@master
        with:
          host: 93.77.188.163
          username: qantr
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # script_stop is REQUIRED. Without it this action does not reliably
          # abort on a failed command: on 2026-07-25 the deploy of 4b0103b
          # reported success in 66s while `npm run build` had actually failed,
          # and prod was left serving 500s. Belt and braces with the fact that
          # the real work is one `bash scripts/deploy/vm-deploy.sh` call whose
          # exit code is unambiguous.
          script_stop: true
          command_timeout: 20m
          script: |
            # Keep this inline part TINY. All real logic lives in the versioned
            # script below, which runs as a single bash process so its exit code
            # is the deploy's exit code (see the comment on script_stop).
            set -euo pipefail
            cd /var/www/whaleabyss
            # Force the VM to exactly match origin/main. A plain `git pull` is
            # blocked by any stray local edit on the VM (this once froze prod 3
            # commits back, and `next build` dirties tsconfig.json every run);
            # reset --hard is immune to that.
            git fetch origin main
            git reset --hard origin/main
            npm install
            bash scripts/deploy/vm-deploy.sh
