<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whale Abyss Banner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Onest Font -->
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- GSAP for After Effects style animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Onest', sans-serif;
            overflow: hidden;
        }

        /* Banner Wrapper to maintain aspect ratio */
        .banner-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 21 / 9;
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 50%, #1e293b 100%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* Floating Particles Background */
        .particle {
            position: absolute;
            background: rgba(96, 165, 250, 0.3);
            border-radius: 50%;
            animation: float-particle 8s infinite ease-in-out;
        }
        @keyframes float-particle {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            50% { transform: translateY(-100px) translateX(30px); opacity: 0.6; }
        }

        /* Valle Mascot - bigger size, appears from left */
        .valle-wrapper {
            position: absolute;
            left: 20px;
            bottom: -30px;
            width: 400px;
            height: 400px;
            z-index: 40;
            pointer-events: none;
        }

        .valle-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: bottom center;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
        }

        /* Logo Container - slides from right to center */
        .logo-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            height: auto;
            z-index: 30;
            background: white;
            border-radius: 20px;
            padding: 25px 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .logo-img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Text Overlays */
        .text-overlay {
            position: absolute;
            z-index: 35;
            color: white;
            font-weight: 800;
            text-shadow: 0 4px 12px rgba(0,0,0,0.8);
        }

        .text-question {
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            text-align: center;
            line-height: 1.3;
        }

        .text-struggle {
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.4rem;
            text-align: center;
            font-weight: 600;
            color: #bfdbfe;
        }

        .text-cta {
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
            text-align: center;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            padding: 12px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
            font-weight: 800;
        }

        /* Glow effect */
        .glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 5;
        }

    </style>
</head>
<body>

    <div class="banner-wrapper" id="banner">
        <!-- Dynamic Background Particles -->
        <div id="particle-container" class="absolute inset-0 z-0"></div>

        <!-- Glow effects -->
        <div class="glow" id="glow1" style="top: 20%; left: 60%;"></div>
        <div class="glow" id="glow2" style="bottom: 15%; left: 15%;"></div>

        <!-- Valle Mascot -->
        <div class="valle-wrapper" id="valle">
            <img src="public/images/valle.png" alt="Valle" class="valle-img">
        </div>

        <!-- Logo Container -->
        <div class="logo-container" id="logo-container">
            <img src="public/images/whale_abyss_full_logo.png" alt="Whale Abyss" class="logo-img">
        </div>

        <!-- Text Overlays -->
        <div class="text-overlay text-question" id="text-question">
            НЕ МОЖЕТЕ ПРОЙТИ<br/>СПИРАЛЬНУЮ БЕЗДНУ?
        </div>

        <div class="text-overlay text-struggle" id="text-struggle">
            Не хватает времени? Сложные персонажи?
        </div>

        <div class="text-overlay text-cta" id="text-cta">
            МЫ ПОМОЖЕМ!
        </div>
    </div>

    <script>
        // Generate random background particles
        const particleContainer = document.getElementById('particle-container');
        for (let i = 0; i < 20; i++) {
            let particle = document.createElement('div');
            particle.classList.add('particle');
            let size = Math.random() * 30 + 5;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.animationDuration = `${Math.random() * 6 + 4}s`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            particleContainer.appendChild(particle);
        }

        // --- GSAP Animation Master Timeline ---
        // Setting up initial states
        gsap.set("#valle", { x: -450, autoAlpha: 1 });
        gsap.set("#logo-container", { x: 800, autoAlpha: 0, rotation: 5 });
        gsap.set("#text-question", { autoAlpha: 0, scale: 0.9 });
        gsap.set("#text-struggle", { autoAlpha: 0, y: 20 });
        gsap.set("#text-cta", { autoAlpha: 0, scale: 0.8 });
        gsap.set("#glow1", { autoAlpha: 0, scale: 0.5 });
        gsap.set("#glow2", { autoAlpha: 0, scale: 0.5 });

        const tl = gsap.timeline({ repeat: -1, repeatDelay: 2 });

        // --- SCENE 1: Valle slides in from left to right ---
        tl.to("#glow2", { duration: 1, autoAlpha: 0.6, scale: 1, ease: "power2.out" })
          .to("#valle", {
              duration: 1.5,
              x: 0,
              ease: "power2.out"
          }, "-=0.8");

        // --- SCENE 2: First question appears ---
        tl.to("#text-question", {
            duration: 0.8,
            autoAlpha: 1,
            scale: 1,
            ease: "back.out(1.2)"
        }, "-=0.5");

        // --- SCENE 3: Struggle text appears ---
        tl.to("#text-struggle", {
            duration: 0.7,
            autoAlpha: 1,
            y: 0,
            ease: "power2.out"
        }, "+=0.5");

        // --- SCENE 4: Valle moves to the left smoothly ---
        tl.to("#valle", {
            duration: 1.2,
            x: -100,
            ease: "power2.inOut"
        }, "+=1");

        // --- SCENE 5: Logo slides from right to center ---
        tl.to("#glow1", { duration: 1, autoAlpha: 0.8, scale: 1.2, ease: "power2.out" }, "-=0.8")
          .to("#logo-container", {
              duration: 1.2,
              x: 0,
              autoAlpha: 1,
              rotation: 0,
              ease: "power3.out"
          }, "-=0.8")
          // Logo subtle pulse
          .to("#logo-container", {
              scale: 1.05,
              duration: 0.3,
              ease: "power2.out"
          })
          .to("#logo-container", {
              scale: 1,
              duration: 0.3,
              ease: "power2.in"
          });

        // --- SCENE 6: CTA appears ---
        tl.to("#text-cta", {
            duration: 0.7,
            autoAlpha: 1,
            scale: 1,
            ease: "back.out(1.5)"
        }, "-=0.3");

        // --- Hold the scene ---
        tl.to({}, { duration: 2.5 });

        // --- SCENE 7: Everything fades out ---
        tl.to("#valle", {
            duration: 0.8,
            x: -450,
            ease: "power2.in"
        })
          .to("#logo-container", {
              duration: 0.8,
              x: 800,
              autoAlpha: 0,
              ease: "power2.in"
          }, "-=0.6")
          .to("#text-question", {
              duration: 0.6,
              autoAlpha: 0,
              scale: 0.9,
              ease: "power2.in"
          }, "-=0.8")
          .to("#text-struggle", {
              duration: 0.6,
              autoAlpha: 0,
              y: 20,
              ease: "power2.in"
          }, "-=0.7")
          .to("#text-cta", {
              duration: 0.6,
              autoAlpha: 0,
              scale: 0.8,
              ease: "power2.in"
          }, "-=0.6")
          .to("#glow1, #glow2", {
              duration: 0.8,
              autoAlpha: 0,
              ease: "power2.in"
          }, "-=0.6");

    </script>
</body>
</html>
