<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whale Abyss Banner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;1,800&display=swap" rel="stylesheet">
    <!-- GSAP for After Effects style animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Deep space/abyss background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* Banner Wrapper to maintain aspect ratio */
        .banner-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 21 / 9;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* Floating Bubbles Background */
        .bubble {
            position: absolute;
            background: rgba(56, 189, 248, 0.2);
            border-radius: 50%;
            bottom: -20px;
            animation: float 5s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-300px) scale(1.5); opacity: 0; }
        }

        /* Main Animated Plate/Container */
        .main-plate {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 70%;
            background: #e0f2fe; /* Light watery blue */
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* Decorative dots */
        .main-plate::before {
            content: '';
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 40px;
            height: 40px;
            background-image: radial-gradient(#94a3b8 2px, transparent 2px);
            background-size: 10px 10px;
            opacity: 0.5;
        }

        /* Decorative top-right wave */
        .plate-decoration {
            position: absolute;
            top: -15px;
            right: 40%;
            width: 100px;
            height: 40px;
            background: #bae6fd;
            border-radius: 40px;
            z-index: -1;
            filter: blur(2px);
        }

        /* Text Containers */
        .text-container {
            position: absolute;
            width: 55%;
            z-index: 20;
        }
        
        .slide {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            opacity: 0; /* Hidden initially */
        }

        /* Slide 1 Styles */
        .s1-line1 { font-size: 1.2rem; font-weight: 800; color: #0284c7; text-transform: uppercase; letter-spacing: 1px; }
        .s1-line2 { font-size: 2.2rem; font-weight: 800; color: #0f172a; line-height: 1.1; margin: 5px 0; }
        .s1-tag { 
            display: inline-block;
            background: #0f172a; 
            color: #fff; 
            padding: 4px 12px; 
            border-radius: 6px; 
            font-size: 0.9rem; 
            font-weight: 700;
            transform: skewX(-10deg);
        }
        .s1-tag span { display: block; transform: skewX(10deg); }

        /* Slide 2 Styles */
        .s2-title { font-size: 2.5rem; font-weight: 800; color: #0f172a; font-style: italic; }
        .cards-container { display: flex; gap: 10px; margin-top: 15px; }
        .g-card {
            width: 50px;
            height: 75px;
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            border: 2px solid #fef3c7;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            opacity: 0;
            position: relative;
            overflow: hidden;
        }
        /* Card inner shine */
        .g-card::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.6), transparent);
            transform: skewX(-20deg);
            animation: shine 3s infinite;
        }
        @keyframes shine {
            100% { left: 200%; }
        }

        /* Slide 3 Styles */
        .s3-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .logo-img { height: 80px; object-fit: contain; margin-bottom: 10px; }
        .s3-desc { color: #334155; font-size: 1rem; font-weight: 600; max-width: 80%; }

        /* Mascot Styles */
        .mascot-wrapper {
            position: absolute;
            right: -20px;
            bottom: -20px;
            width: 320px;
            height: 320px;
            z-index: 30;
            pointer-events: none;
        }
        
        /* Using a morphing blob shape to frame the image nicely */
        .mascot-blob {
            position: absolute;
            bottom: 20px;
            right: 40px;
            width: 220px;
            height: 220px;
            background-color: #7dd3fc;
            border: 6px solid #fff;
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            overflow: hidden;
            animation: morph 8s ease-in-out infinite;
        }

        .mascot-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            transform: scale(1.1); /* Zoom slightly to avoid edge gaps */
        }

        @keyframes morph {
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
            67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
        }

    </style>
</head>
<body>

    <div class="banner-wrapper" id="banner">
        <!-- Dynamic Background Bubbles generated via JS -->
        <div id="bubble-container" class="absolute inset-0 z-0"></div>

        <!-- Central Plate -->
        <div class="main-plate" id="plate">
            <div class="plate-decoration"></div>
            
            <div class="text-container">
                <!-- Slide 1 -->
                <div class="slide s1" id="slide1">
                    <div class="s1-line1">Need to clear</div>
                    <div class="s1-line2">THE ABYSS</div>
                    <div class="s1-tag"><span>IN GENSHIN IMPACT?</span></div>
                </div>

                <!-- Slide 2 -->
                <div class="slide s2" id="slide2">
                    <div class="s2-title">WE CAN HELP!</div>
                    <div class="cards-container" id="cards">
                        <div class="g-card"></div>
                        <div class="g-card"></div>
                        <div class="g-card"></div>
                    </div>
                </div>

                <!-- Slide 3 -->
                <div class="slide s3" id="slide3">
                    <div class="s3-container">
                        <img src="Frame 1(2).png" alt="Whale Abyss" class="logo-img">
                        <p class="s3-desc">Premium Boosting Services.<br/>Advance your account efficiently.</p>
                    </div>
                </div>
            </div>

            <!-- Mascot Element -->
            <div class="mascot-wrapper" id="mascot">
                <div class="mascot-blob" id="mascot-blob">
                    <img src="image_77ce47.jpg" alt="Mascot" class="mascot-img">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Generate random background bubbles
        const bubbleContainer = document.getElementById('bubble-container');
        for (let i = 0; i < 15; i++) {
            let bubble = document.createElement('div');
            bubble.classList.add('bubble');
            let size = Math.random() * 40 + 10;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}%`;
            bubble.style.animationDuration = `${Math.random() * 4 + 3}s`;
            bubble.style.animationDelay = `${Math.random() * 5}s`;
            bubbleContainer.appendChild(bubble);
        }

        // --- GSAP Animation Master Timeline ---
        // Setting up initial states
        gsap.set("#slide1", { autoAlpha: 0, x: -30 });
        gsap.set("#slide2", { autoAlpha: 0, y: 30 });
        gsap.set("#slide3", { autoAlpha: 0, scale: 0.8 });
        gsap.set(".g-card", { y: 50, rotation: 15 });
        gsap.set("#mascot", { autoAlpha: 0, x: 50, rotation: 10 });
        gsap.set("#plate", { scale: 0.8, autoAlpha: 0 });

        const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.5 });

        // --- SCENE 1: Intro ---
        tl.to("#plate", { duration: 1, scale: 1, autoAlpha: 1, ease: "elastic.out(1, 0.8)" })
          .to("#mascot", { duration: 0.8, autoAlpha: 1, x: 0, rotation: 0, ease: "back.out(1.5)" }, "-=0.6")
          .to("#slide1", { duration: 0.6, autoAlpha: 1, x: 0, ease: "power2.out" }, "-=0.4")
          
          // Mascot tiny floating effect during Scene 1
          .to("#mascot-blob", { y: -10, duration: 1.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, "-=0.6");

        // --- SCENE 2: "We can help!" ---
        tl.to("#slide1", { duration: 0.5, autoAlpha: 0, y: -20, ease: "power2.in" }, "+=1.5")
          .to("#slide2", { duration: 0.5, autoAlpha: 1, y: 0, ease: "back.out(1.2)" })
          // Cards popping up like in the video
          .to(".g-card", { 
              duration: 0.6, 
              autoAlpha: 1, 
              y: 0, 
              rotation: (i) => i === 0 ? -10 : i === 1 ? 0 : 10, // fan out
              stagger: 0.15, 
              ease: "back.out(1.5)" 
          }, "-=0.2")
          // Mascot reacts (jumps/scales up like putting on sunglasses in the video)
          .to("#mascot-blob", { scale: 1.1, duration: 0.3, ease: "power2.out" }, "-=0.5")
          .to("#mascot-blob", { scale: 1, duration: 0.3, ease: "bounce.out" });

        // --- SCENE 3: Logo Reveal ---
        tl.to(".g-card", { duration: 0.4, autoAlpha: 0, y: -30, stagger: 0.05, ease: "power2.in" }, "+=2")
          .to("#slide2", { duration: 0.4, autoAlpha: 0, x: -30, ease: "power2.in" }, "-=0.2")
          // Hide mascot
          .to("#mascot", { duration: 0.6, autoAlpha: 0, x: 50, ease: "back.in(1.2)" }, "<")
          // Expand plate to center text
          .to("#plate", { width: "95%", backgroundColor: "#ffffff", duration: 0.8, ease: "power3.inOut" })
          // Show slide 3 (Logo)
          .to("#slide3", { duration: 0.6, autoAlpha: 1, scale: 1, ease: "back.out(1.2)" }, "-=0.2");

        // --- OUTRO: Fade out to loop ---
        tl.to("#plate", { duration: 0.8, autoAlpha: 0, scale: 0.9, ease: "power2.in" }, "+=3");

    </script>
</body>
</html>
