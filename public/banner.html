<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whale Abyss Banner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Onest Font -->
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- GSAP for After Effects style animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Onest', sans-serif;
            overflow: hidden;
        }

        /* Banner Wrapper to maintain aspect ratio */
        .banner-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 21 / 9;
            background: #FFFFFF;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        /* Floating Particles Background - REMOVED */

        /* Valle Mascot - lagging effect, positioned on the left */
        .valle-wrapper {
            position: absolute;
            left: 5%;
            top: 50%;
            transform: translateY(-50%);
            width: 320px;
            height: 320px;
            z-index: 40;
            pointer-events: none;
        }

        .valle-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
        }

        /* Text Overlays - Big Italic, positioned on the right */
        .text-overlay {
            position: absolute;
            z-index: 35;
            color: #3b82f6;
            font-weight: 800;
            font-style: italic;
            text-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
            top: 50%;
            right: 3%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            text-align: left;
            line-height: 1.4;
            width: 50%;
        }

        /* Logo Container - on the right side */
        .logo-container {
            position: absolute;
            top: 50%;
            right: 5%;
            transform: translateY(-50%);
            width: 55%;
            max-width: 400px;
            height: auto;
            z-index: 30;
        }

        /* CTA Text - above logo */
        .cta-text {
            position: absolute;
            top: 20%;
            right: 5%;
            transform: translateY(-50%);
            z-index: 35;
            text-align: center;
            width: 55%;
            max-width: 400px;
        }

        .cta-heading {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .cta-url {
            font-size: 2.2rem;
            font-weight: 900;
            color: #3b82f6;
            letter-spacing: -0.02em;
        }

        /* Glow effect - REMOVED */

    </style>
</head>
<body>

    <div class="banner-wrapper" id="banner">
        <!-- Valle Mascot Sad -->
        <div class="valle-wrapper" id="valle-sad">
            <img src="images/valle_chibi_sad.png" alt="Valle Sad" class="valle-img">
        </div>

        <!-- Valle Mascot Happy -->
        <div class="valle-wrapper" id="valle-happy">
            <img src="images/valle_chibi_happy.png" alt="Valle Happy" class="valle-img">
        </div>

        <!-- Logo Container -->
        <div class="logo-container" id="logo-container">
            <img src="images/whale_abyss_full_logo.png" alt="Whale Abyss" class="logo-img">
        </div>

        <!-- CTA Text -->
        <div class="cta-text" id="cta-text">
            <div class="cta-heading">Закажи буст прямо сейчас!</div>
            <div class="cta-url">whaleabyss.ru</div>
        </div>

        <!-- Text Overlays -->
        <div class="text-overlay" id="text-question1">
            Не успеваешь зачистить карту?
        </div>

        <div class="text-overlay" id="text-question2">
            Не можешь пройти натиск или театр?
        </div>
    </div>

    <script>
        // --- GSAP Animation Master Timeline ---
        // Setting up initial states
        gsap.set("#valle-sad", { autoAlpha: 0, rotation: 0 });
        gsap.set("#valle-happy", { autoAlpha: 0, rotation: 0 });
        gsap.set("#logo-container", { autoAlpha: 0, x: 100 });
        gsap.set("#cta-text", { autoAlpha: 0, x: 100 });
        gsap.set("#text-question1", { autoAlpha: 0, x: 100 });
        gsap.set("#text-question2", { autoAlpha: 0, x: 100 });

        const tl = gsap.timeline({ repeat: -1, repeatDelay: 1 });

        // --- SCENE 1: First question appears with animation, sad Valle lagging effect ---
        tl.to("#text-question1", {
              duration: 0.6,
              autoAlpha: 1,
              x: 0,
              ease: "power2.out"
          });

        // Sad Valle appears with faster lagging rotation effect (more frequent, more catchy)
        tl.to("#valle-sad", { duration: 0.1, autoAlpha: 1, rotation: -8 }, "+=0.3")
          .to("#valle-sad", { duration: 0.1, rotation: 5 }, "+=0.5")
          .to("#valle-sad", { duration: 0.1, rotation: -6 }, "+=0.5")
          .to("#valle-sad", { duration: 0.1, rotation: 7 }, "+=0.5")
          .to("#valle-sad", { duration: 0.1, rotation: -4 }, "+=0.5")
          .to("#valle-sad", { duration: 0.1, rotation: 6 }, "+=0.5")
          .to("#valle-sad", { duration: 0.1, rotation: 0 }, "+=0.5");

        // --- SCENE 2: Second question appears ---
        tl.to("#text-question1", {
            duration: 0.4,
            autoAlpha: 0,
            x: -100,
            ease: "power2.in"
        }, "+=1")
          .to("#text-question2", {
              duration: 0.6,
              autoAlpha: 1,
              x: 0,
              ease: "power2.out"
          }, "-=0.2");

        // Continue sad Valle lagging with more frequency
        tl.to("#valle-sad", { duration: 0.1, rotation: -7 }, "+=0.5")
          .to("#valle-sad", { duration: 0.1, rotation: 4 }, "+=0.5")
          .to("#valle-sad", { duration: 0.1, rotation: -5 }, "+=0.5")
          .to("#valle-sad", { duration: 0.1, rotation: 6 }, "+=0.5")
          .to("#valle-sad", { duration: 0.1, rotation: -3 }, "+=0.5");

        // --- SCENE 3: Remove sad Valle and second question ---
        tl.to("#text-question2", {
            duration: 0.4,
            autoAlpha: 0,
            x: -100,
            ease: "power2.in"
        }, "+=1")
          .to("#valle-sad", {
              duration: 0.3,
              autoAlpha: 0,
              ease: "power2.in"
          }, "-=0.2");

        // --- SCENE 4: Show website logo on the right ---
        tl.to("#logo-container", {
              duration: 0.8,
              autoAlpha: 1,
              x: 0,
              ease: "back.out(1.3)"
          }, "+=0.3")
          .to("#cta-text", {
              duration: 0.8,
              autoAlpha: 1,
              x: 0,
              ease: "back.out(1.3)"
          }, "-=0.6");

        // --- SCENE 5: Happy Valle appears on the left with faster lagging effect ---
        tl.to("#valle-happy", { duration: 0.1, autoAlpha: 1, rotation: 8 }, "+=0.3")
          .to("#valle-happy", { duration: 0.1, rotation: -5 }, "+=0.5")
          .to("#valle-happy", { duration: 0.1, rotation: 7 }, "+=0.5")
          .to("#valle-happy", { duration: 0.1, rotation: -4 }, "+=0.5")
          .to("#valle-happy", { duration: 0.1, rotation: 6 }, "+=0.5")
          .to("#valle-happy", { duration: 0.1, rotation: -3 }, "+=0.5")
          .to("#valle-happy", { duration: 0.1, rotation: 5 }, "+=0.5")
          .to("#valle-happy", { duration: 0.1, rotation: 0 }, "+=0.5");

        // --- Hold the scene ---
        tl.to({}, { duration: 2 });

        // --- SCENE 6: Everything fades out ---
        tl.to("#logo-container", {
            duration: 0.5,
            autoAlpha: 0,
            x: 100,
            ease: "power2.in"
        })
          .to("#cta-text", {
              duration: 0.5,
              autoAlpha: 0,
              x: 100,
              ease: "power2.in"
          }, "-=0.4")
          .to("#valle-happy", {
              duration: 0.4,
              autoAlpha: 0,
              ease: "power2.in"
          }, "-=0.3");

    </script>
</body>
</html>
