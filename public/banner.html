<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whale Abyss Banner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Onest Font -->
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- GSAP for After Effects style animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Onest', sans-serif;
            overflow: hidden;
        }

        /* Banner Wrapper — parallelogram silhouette with rounded corners
           via an inline SVG <clipPath>. drop-shadow follows the rounded
           clipped shape (box-shadow does not). */
        .banner-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 3 / 1;
            background: #FFFFFF;
            overflow: hidden;
            clip-path: url(#parallelogramClip);
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.18));
        }

        /* Floating Particles Background - REMOVED */

        /* Valle Mascot - lagging effect, positioned on the left */
        .valle-wrapper {
            position: absolute;
            left: 8%;
            top: 50%;
            transform: translateY(-50%);
            width: 320px;
            height: 320px;
            z-index: 40;
            pointer-events: none;
        }

        .valle-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
        }

        /* Text Overlays - Big Italic, positioned on the right */
        .text-overlay {
            position: absolute;
            z-index: 35;
            color: #3b82f6;
            font-weight: 800;
            font-style: italic;
            text-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
            top: 50%;
            right: 8%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            text-align: left;
            line-height: 1.4;
            width: 50%;
        }

        /* Logo Container - on the right side.
           Inset from right edge so it stays clear of the parallelogram's
           bottom-right slant (clip-path cuts inward at 90% there). */
        .logo-container {
            position: absolute;
            top: 50%;
            right: 9%;
            transform: translateY(-50%);
            width: 55%;
            max-width: 400px;
            height: auto;
            z-index: 30;
        }

        /* CTA Text - above logo. Same right inset as the logo so they stay
           visually aligned. */
        .cta-text {
            position: absolute;
            top: 20%;
            right: 9%;
            transform: translateY(-50%);
            z-index: 35;
            text-align: center;
            width: 55%;
            max-width: 400px;
        }

        .cta-heading {
            font-size: 1.8rem;
            font-weight: 800;
            color: #3b82f6;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .cta-url {
            font-size: 2.6rem;
            font-weight: 900;
            color: #000000;
            letter-spacing: -0.02em;
        }

        /* Glow effect - REMOVED */

    </style>
</head>
<body>

    <!-- SVG clip-path defining the rounded parallelogram silhouette.
         All coords are in objectBoundingBox units (0–1), so the shape
         scales with .banner-wrapper. Each vertex is a small quadratic
         Bezier giving a gentle rounded corner. -->
    <svg width="0" height="0" style="position:absolute;" aria-hidden="true">
        <defs>
            <clipPath id="parallelogramClip" clipPathUnits="objectBoundingBox">
                <path d="M 0.112,0
                         L 0.988,0
                         Q 1,0 0.9964,0.036
                         L 0.9036,0.964
                         Q 0.9,1 0.888,1
                         L 0.012,1
                         Q 0,1 0.0036,0.964
                         L 0.0964,0.036
                         Q 0.1,0 0.112,0
                         Z" />
            </clipPath>
        </defs>
    </svg>

    <div class="banner-wrapper" id="banner">
        <!-- Valle Mascot Sad -->
        <div class="valle-wrapper" id="valle-sad">
            <img src="images/valle_chibi_sad.png" alt="Valle Sad" class="valle-img">
        </div>

        <!-- Valle Mascot Happy -->
        <div class="valle-wrapper" id="valle-happy">
            <img src="images/valle_chibi_happy.png" alt="Valle Happy" class="valle-img">
        </div>

        <!-- Logo Container -->
        <div class="logo-container" id="logo-container">
            <img src="images/whale_abyss_full_logo.png" alt="Whale Abyss" class="logo-img">
        </div>

        <!-- CTA Text -->
        <div class="cta-text" id="cta-text">
            <div class="cta-heading">Закажи буст прямо сейчас!</div>
            <div class="cta-url">whaleabyss.ru</div>
        </div>

        <!-- Text Overlays -->
        <div class="text-overlay" id="text-question1">
            Не успеваешь зачистить карту?
        </div>

        <div class="text-overlay" id="text-question2">
            Не можешь пройти натиск или театр?
        </div>
    </div>

    <script>
        // --- GSAP Animation Master Timeline ---
        // Setting up initial states
        gsap.set("#valle-sad", { autoAlpha: 0, rotation: 0 });
        gsap.set("#valle-happy", { autoAlpha: 0, rotation: 0 });
        gsap.set("#logo-container", { autoAlpha: 0, x: 100 });
        gsap.set("#cta-text", { autoAlpha: 0, x: 100 });
        gsap.set("#text-question1", { autoAlpha: 0, x: 100 });
        gsap.set("#text-question2", { autoAlpha: 0, x: 100 });

        // --- Independent ticking loops (stepped / hold keyframes) ---
        // Each Valle snaps between rotation poses with NO interpolation —
        // .set() jumps instantly, "+=0.3" holds that pose for 0.3s. Mimics
        // stop-motion / "hold keyframes" in After Effects. Runs while Valle
        // is visible and never stops between scene transitions.
        const HOLD = 0.3;

        const sadTick = gsap.timeline({ repeat: -1, paused: true });
        sadTick.set("#valle-sad", { rotation: -8 })
               .set("#valle-sad", { rotation:  6 }, `+=${HOLD}`)
               .set("#valle-sad", { rotation: -5 }, `+=${HOLD}`)
               .set("#valle-sad", { rotation:  7 }, `+=${HOLD}`)
               .to({}, { duration: HOLD }); // hold last pose before looping

        const happyTick = gsap.timeline({ repeat: -1, paused: true });
        happyTick.set("#valle-happy", { rotation:  8 })
                 .set("#valle-happy", { rotation: -5 }, `+=${HOLD}`)
                 .set("#valle-happy", { rotation:  7 }, `+=${HOLD}`)
                 .set("#valle-happy", { rotation: -3 }, `+=${HOLD}`)
                 .to({}, { duration: HOLD }); // hold last pose before looping

        const tl = gsap.timeline({ repeat: -1, repeatDelay: 1 });

        // --- SCENE 1: First CIA + sad Valle appear together, ticking starts ---
        tl.to("#text-question1", {
              duration: 0.3,
              autoAlpha: 1,
              x: 0,
              ease: "power2.out"
          })
          .to("#valle-sad", {
              duration: 0.3,
              autoAlpha: 1,
              ease: "power2.out",
              onStart: () => sadTick.restart()
          }, "<");

        // --- SCENE 2: Swap CIA texts (sad Valle keeps ticking) ---
        tl.to("#text-question1", {
            duration: 0.4,
            autoAlpha: 0,
            x: -100,
            ease: "power2.in"
        }, "+=2")
          .to("#text-question2", {
              duration: 0.3,
              autoAlpha: 1,
              x: 0,
              ease: "power2.out"
          }, "-=0.2");

        // --- SCENE 3: Fade out CIA2 + sad Valle, ticking stops ---
        tl.to("#text-question2", {
            duration: 0.4,
            autoAlpha: 0,
            x: -100,
            ease: "power2.in"
        }, "+=2")
          .to("#valle-sad", {
              duration: 0.3,
              autoAlpha: 0,
              ease: "power2.in",
              onComplete: () => {
                  sadTick.pause();
                  gsap.set("#valle-sad", { rotation: 0 });
              }
          }, "-=0.2");

        // --- SCENE 4: Logo + CTA + happy Valle appear together, ticking starts ---
        tl.to("#logo-container", {
              duration: 0.8,
              autoAlpha: 1,
              x: 0,
              ease: "back.out(1.3)"
          }, "+=0.3")
          .to("#cta-text", {
              duration: 0.5,
              autoAlpha: 1,
              x: 0,
              ease: "back.out(1.3)"
          }, "-=0.6")
          .to("#valle-happy", {
              duration: 0.5,
              autoAlpha: 1,
              ease: "back.out(1.3)",
              onStart: () => happyTick.restart()
          }, "<");

        // --- Hold the scene ---
        tl.to({}, { duration: 2 });

        // --- SCENE 5: Everything fades out, ticking stops ---
        tl.to("#logo-container", {
            duration: 0.5,
            autoAlpha: 0,
            x: 100,
            ease: "power2.in"
        })
          .to("#cta-text", {
              duration: 0.5,
              autoAlpha: 0,
              x: 100,
              ease: "power2.in"
          }, "-=0.4")
          .to("#valle-happy", {
              duration: 0.4,
              autoAlpha: 0,
              ease: "power2.in",
              onComplete: () => {
                  happyTick.pause();
                  gsap.set("#valle-happy", { rotation: 0 });
              }
          }, "-=0.3");

    </script>
</body>
</html>
